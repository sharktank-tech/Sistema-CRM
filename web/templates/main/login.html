<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar · CRM</title>
<style>
  :root{color-scheme:light dark;--page:#f5fbf8;--surface:#ffffff;--ink:#10261d;--muted:#425e52;--faint:#5f746a;--line:rgba(16,38,29,.12);--line-strong:rgba(16,38,29,.28);--accent:#e6b400;--accent-2:#ffd24a;--accent-contrast:#10261d;--focus-ring:#087a63;--danger:#b52f37;--danger-bg:#ffe6e7;--font-body:'Segoe UI',Arial,sans-serif}
  @media (prefers-color-scheme:dark){:root{--page:#0a1220;--surface:#132238;--ink:#f4f7fb;--muted:#c3cee0;--faint:#a9b8ce;--line:rgba(214,228,255,.14);--line-strong:rgba(214,228,255,.26);--focus-ring:rgba(96,165,250,.78)}}
  *{box-sizing:border-box}body{margin:0;min-width:320px;min-height:100vh;display:grid;place-items:center;background:var(--page);color:var(--ink);font-family:var(--font-body);-webkit-font-smoothing:antialiased}
  .card{width:min(92vw,400px);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:1.8rem;box-shadow:0 10px 30px rgba(15,77,58,.08)}
  .marca{display:flex;align-items:center;gap:.6rem;margin-bottom:1.4rem}
  .marca-mark{width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--line);border-radius:10px;color:var(--accent-contrast);background:var(--accent);font-weight:700}
  .marca b{font-size:1.05rem}
  h1{font-size:1.25rem;margin:0 0 .3rem}
  .desc{color:var(--muted);font-size:.82rem;margin:0 0 1.4rem}
  label{display:block;margin:.7rem 0 .25rem;color:var(--muted);font-size:.74rem;font-weight:600}
  input{width:100%;min-height:42px;padding:.5rem .65rem;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink);font-size:16px}
  input:focus{border-color:var(--focus-ring);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--focus-ring) 24%,transparent)}
  button{width:100%;min-height:44px;margin-top:1.2rem;border:0;border-radius:9px;background:var(--accent);color:var(--accent-contrast);font-size:.9rem;font-weight:700;cursor:pointer}
  button:hover{background:var(--accent-2)}
  .erro{margin:0 0 1rem;padding:.6rem .8rem;border:1px solid color-mix(in srgb,var(--danger) 30%,transparent);border-radius:8px;background:var(--danger-bg);color:var(--danger);font-size:.78rem}
  .flash{margin:0 0 1rem;padding:.6rem .8rem;border:1px solid var(--line);border-radius:8px;font-size:.78rem}
  .voltar{display:block;margin-top:1.2rem;color:var(--faint);font-size:.74rem;text-align:center;text-decoration:none}
</style>
</head>
<body>
<main class="card">
  <div class="marca">
    <span class="marca-mark" aria-hidden="true">C</span>
    <b>Sistema CRM</b>
  </div>

  <h1>Acesse sua conta</h1>
  <p class="desc">Entre com o e-mail e a senha cadastrados.</p>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
    <p class="flash">{{ message }}</p>
    {% endfor %}
  {% endwith %}

  {% if erro %}
  <p class="erro" role="alert">{{ erro }}</p>
  {% endif %}

  <form method="post" action="{{ url_for('main.login') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="email">E-mail</label>
    <input id="email" name="email" type="email" autocomplete="username" required autofocus>
    <label for="senha">Senha</label>
    <input id="senha" name="senha" type="password" autocomplete="current-password" required>
    <button type="submit">Entrar</button>
  </form>

  <a class="voltar" href="{{ url_for('main.login') }}">Sistema CRM</a>
</main>
</body>
</html>
